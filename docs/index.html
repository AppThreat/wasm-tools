<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>wasm-tools documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentation for wasm-tools, a pure-Python WebAssembly parser, disassembler, and security triage toolkit.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" media="(prefers-color-scheme: dark)" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <link rel="stylesheet" media="(prefers-color-scheme: light)" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&family=Source+Sans+3:wght@300;400;500;700&display=swap');
    :root {
      --theme-hue      : 262;
      --base-font-size : 15px;
      --theme-color    : #7c5cff;
      --modular-scale  : 1.333;

      --modular-scale--2 : calc(var(--modular-scale--1) / var(--modular-scale));
      --modular-scale--1 : calc(var(--modular-scale-1) / var(--modular-scale));
      --modular-scale-1  : 1rem;
      --modular-scale-2  : calc(var(--modular-scale-1) * var(--modular-scale));
      --modular-scale-3  : calc(var(--modular-scale-2) * var(--modular-scale));

      --font-size-xxxl   : var(--modular-scale-3);
      --font-size-xxl    : calc(var(--modular-scale-3) * 0.92);
      --font-size-xl     : var(--modular-scale-2);
      --font-size-l      : var(--modular-scale-1);
      --font-size-m      : var(--modular-scale-1);

      --code-font-family : 'Source Code Pro', monospace;
      --cover-max-width  : 78em;
      --content-max-width: 80em;
      --sidebar-width    : 17rem;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(124, 92, 255, 0.10), transparent 32%),
        radial-gradient(circle at top right, rgba(53, 152, 219, 0.08), transparent 28%);
    }

    section.cover.show {
      background: transparent;
    }

    section.cover .cover-main {
      max-width: min(72rem, calc(100vw - 2rem));
      margin: 2rem auto 0;
      padding: 2.5rem 3rem 3rem;
      text-align: left;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 20px 70px rgba(17, 24, 39, 0.14);
    }

    @media (prefers-color-scheme: dark) {
      section.cover .cover-main {
        background: rgba(17, 24, 39, 0.88);
        box-shadow: 0 20px 70px rgba(0, 0, 0, 0.45);
      }
    }

    section.cover .cover-main > h1 {
      font-size: clamp(2.4rem, 5vw, 4rem);
      line-height: 1.05;
      margin-bottom: 0.8rem;
      letter-spacing: -0.03em;
    }

    section.cover .cover-main > blockquote {
      margin: 0 0 1.4rem;
      padding-left: 1rem;
      border-left: 4px solid var(--theme-color);
      color: var(--theme-color);
      font-size: 1.05rem;
      font-weight: 600;
    }

    section.cover .cover-main > p:last-of-type {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-top: 1.4rem;
    }

    section.cover .cover-main > p:last-of-type a {
      margin: 0;
      padding: 0.7rem 1.05rem;
      border-radius: 999px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: none;
    }

    .markdown-section {
      line-height: 1.65;
      max-width: 60em;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3 {
      letter-spacing: -0.02em;
    }

    .markdown-section pre,
    .markdown-section pre > code {
      line-height: 1.45;
    }

    @media (max-width: 960px) {
      section.cover .cover-main {
        margin-top: 1rem;
        padding: 2rem 1.4rem 2.2rem;
        text-align: center;
      }

      section.cover .cover-main > blockquote {
        padding-left: 0;
        border-left: 0;
      }

      section.cover .cover-main > p:last-of-type {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
<div id="app"></div>
<script>
  window.$docsify = {
    name: 'wasm-tools',
    repo: 'https://github.com/appthreat/wasm-tools',
    loadSidebar: true,
    subMaxLevel: 3,
    coverpage: '_coverpage.md',
    auto2top: true,
    onlyCover: false,
    themeColor: '#7c5cff',
    search: {
      noData: {
        '/': 'No results!'
      },
      paths: 'auto',
      placeholder: {
        '/': 'Search the docs'
      }
    }
  }
</script>
<!-- Docsify v4 -->
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({
    startOnLoad: false,
    suppressErrors: true,
    theme: window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default'
  });

  // Render ```mermaid fences on every docsify page load. Fences arrive as
  // <pre><code class="lang-mermaid">; they are swapped for a .mermaid div and
  // rendered with mermaid.run, which skips data-processed nodes on revisits.
  window.$docsify = window.$docsify || {};
  window.$docsify.plugins = (window.$docsify.plugins || []).concat([
    function (hook) {
      function renderMermaid() {
        var blocks = document.querySelectorAll(
          '.markdown-section pre > code.lang-mermaid, .markdown-section pre > code.language-mermaid'
        );
        if (!blocks.length) return;
        blocks.forEach(function (el) {
          var div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = el.textContent;
          el.parentElement.replaceWith(div);
        });
        mermaid.run({ querySelector: '.markdown-section .mermaid:not([data-processed])' });
      }
      hook.ready(renderMermaid);
      hook.doneEach(renderMermaid);
    }
  ]);
</script>
</body>
</html>
